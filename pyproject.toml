[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Asynchronous multi-agent runtime platform with DAG orchestration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "AgentForge" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<7",
  "httpx>=0.28,<1",
  "sse-starlette>=2.2,<4",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "docker>=7.1,<8",
  "jmespath>=1.0,<2",
  "json-logic-qubit>=0.9,<1",
  "openai>=1.59,<3",
  "langgraph>=0.2.60,<2",
  "langchain-core>=0.3.30,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "pgvector>=0.3.6,<1",
  "pypdf>=5,<7",
  "tenacity>=9,<10",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "aiofiles>=24.1,<25",
  "mcp>=1.7,<2",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "pytest-timeout>=2.3,<3",
  "aiosqlite>=0.20,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pip-tools>=7.4,<8",
  "playwright>=1.49,<2",
  "locust>=2.32,<3",
]

[project.scripts]
agentforge = "agentforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL/Redis/Docker",
  "live: calls external APIs and requires explicit opt-in",
  "e2e: exercises the browser or HTTP gateway",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF012"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agentforge"]
strict = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
