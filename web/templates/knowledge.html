{% extends "base.html" %}
{% block title %}知识库 · AgentForge{% endblock %}
{% block heading %}知识库{% endblock %}
{% block content %}
<div class="split">
  <section class="panel grow">
    <div class="panel-head"><h2>知识库</h2></div>
    {% for base in bases %}
    <article class="list-card">
      <div><strong>{{ base.name }}</strong><p>{{ base.description or '向量与全文混合检索' }}</p></div>
      <form method="post" enctype="multipart/form-data" action="/app/knowledge/{{ base.id }}/upload" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="file" name="file" accept=".txt,.md,.pdf,.csv,.json" required>
        <button class="btn" type="submit">上传并索引</button>
      </form>
    </article>
    {% else %}<div class="empty">尚未创建知识库。</div>{% endfor %}
  </section>
  <aside class="panel narrow">
    <h2>新建知识库</h2>
    <form method="post" action="/app/knowledge" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>名称<input name="name" required></label>
      <label>说明<textarea name="description" rows="4"></textarea></label>
      <button class="btn primary" type="submit">创建</button>
    </form>
  </aside>
</div>
{% endblock %}
